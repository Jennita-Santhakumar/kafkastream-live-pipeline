name: CI

on:
  push:
  pull_request:

jobs:
  producer-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r producer/requirements-dev.txt
      - run: pytest producer/tests -v

  streaming-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r streaming/requirements-dev.txt
      - name: Unit tests (local Spark, no Docker)
        run: pytest streaming/tests -v -m "not integration"
      - name: Integration test (real Kafka via testcontainers + real Delta writes)
        run: pytest streaming/tests -v -m integration

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements-dev.txt
      - run: pytest backend/tests -v

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
